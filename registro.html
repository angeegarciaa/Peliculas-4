
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Series App</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <main class="pantalla-auth">
        <h1>Crear cuenta</h1>

        <form id="form-registro">
            <label for="email-registro">Correo electrónico</label>
            <input type="email" id="email-registro" required>

            <label for="password-registro">Contraseña</label>
            <input type="password" id="password-registro" minlength="6" required>

            <button type="submit">Registrarme</button>
        </form>

        <p>¿Ya tenés cuenta?</p>
        <a href="login.html">Iniciar sesión</a>

        <p><a href="index.html">Volver al inicio</a></p>
    </main>

    <script src="supabase.js"></script>
    <script src="auth.js"></script>
</body>
</html>
